stages:
  - history_scan
  - validate
  - release_hold

default:
  interruptible: true

history_secret_scan:
  image: alpine:3.22
  stage: history_scan
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache curl git tar
  script:
    - curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    - echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
    - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    - /tmp/gitleaks git --no-banner --redact --log-opts="--all" .

.cli_checks:
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - npm run check
    - npm run check:beta-readiness
    - node scripts/test.mjs
    - node scripts/ci-package-smoke.mjs

linux_x64:
  extends: .cli_checks
  image: node:22.19.0-bookworm
  stage: validate
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
    - ln -s "$(command -v fdfind)" /usr/local/bin/fd

linux_arm64:
  extends: .cli_checks
  image: node:22.19.0-bookworm
  stage: validate
  tags:
    - saas-linux-small-arm64
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
    - ln -s "$(command -v fdfind)" /usr/local/bin/fd

macos_arm64:
  stage: validate
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  before_script:
    - brew install node@22 fd ripgrep
    - export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
  script:
    - export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - npm run check
    - npm run check:beta-readiness
    - node scripts/test.mjs
    - node scripts/ci-package-smoke.mjs

windows_x64:
  stage: validate
  tags:
    - saas-windows-medium-amd64
  before_script:
    - choco install nodejs --version=22.19.0 --yes --no-progress
    - choco install fd --version=10.4.2 --yes --no-progress
    - choco install ripgrep --version=14.1.0 --yes --no-progress
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
  script:
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - npm run check
    - npm run check:beta-readiness
    - node scripts/test.mjs
    - node scripts/ci-package-smoke.mjs

release_hold:
  image: alpine:3.22
  stage: release_hold
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Release blocked until GitLab Windows ARM64 validation and protected candidate/finalization environments are available."
    - exit 1
