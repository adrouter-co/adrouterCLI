stages:
  - history_scan
  - validate
  - release_hold

default:
  interruptible: true

history_secret_scan:
  image: alpine:3.22
  stage: history_scan
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache curl git tar
  script:
    - curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    - echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c
    - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    - /tmp/gitleaks git --no-banner --redact --log-opts="--all" .

.cli_checks:
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - npm run check
    - npm run check:beta-readiness
    - node scripts/test.mjs
    - node scripts/ci-package-smoke.mjs

.linux_cli_checks:
  script:
    - runuser --user node -- npm ci --ignore-scripts --no-audit --no-fund
    - runuser --user node -- npm run build
    - runuser --user node -- npm run check
    - runuser --user node -- npm run check:beta-readiness
    - runuser --user node -- node scripts/test.mjs
    - runuser --user node -- node scripts/ci-package-smoke.mjs

linux_x64:
  extends: .linux_cli_checks
  image: node:22.19.0-bookworm
  stage: validate
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ripgrep
    - curl --fail --location --silent --show-error --output /tmp/fd.tar.gz https://github.com/sharkdp/fd/releases/download/v10.4.2/fd-v10.4.2-x86_64-unknown-linux-gnu.tar.gz
    - echo 'def59805cd14b5651b68990855f426ad087f3b96881296d963910431ba3143c8  /tmp/fd.tar.gz' | sha256sum -c
    - tar -xzf /tmp/fd.tar.gz -C /tmp
    - install --mode=0755 /tmp/fd-v10.4.2-x86_64-unknown-linux-gnu/fd /usr/local/bin/fd
    - chown --recursive node:node "$CI_PROJECT_DIR"

linux_arm64:
  extends: .linux_cli_checks
  image: node:22.19.0-bookworm
  stage: validate
  tags:
    - saas-linux-small-arm64
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ripgrep
    - curl --fail --location --silent --show-error --output /tmp/fd.tar.gz https://github.com/sharkdp/fd/releases/download/v10.4.2/fd-v10.4.2-aarch64-unknown-linux-gnu.tar.gz
    - echo '6c51f7c5446b3338b1e401ff15dc194c590bb2fa64fd43ff3278300f073adec5  /tmp/fd.tar.gz' | sha256sum -c
    - tar -xzf /tmp/fd.tar.gz -C /tmp
    - install --mode=0755 /tmp/fd-v10.4.2-aarch64-unknown-linux-gnu/fd /usr/local/bin/fd
    - chown --recursive node:node "$CI_PROJECT_DIR"

macos_arm64:
  stage: validate
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  before_script:
    - brew install node@22 fd ripgrep
    - export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
  script:
    - export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - npm run check
    - npm run check:beta-readiness
    - node scripts/test.mjs
    - node scripts/ci-package-smoke.mjs

windows_x64:
  stage: validate
  tags:
    - saas-windows-medium-amd64
  before_script:
    - choco install nodejs --version=22.19.0 --yes --no-progress
    - choco install fd --version=10.4.2 --yes --no-progress
    - choco install ripgrep --version=14.1.0 --yes --no-progress
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
  script:
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - npm run check
    - npm run check:beta-readiness
    - node scripts/test.mjs
    - node scripts/ci-package-smoke.mjs

release_hold:
  image: alpine:3.22
  stage: release_hold
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Release blocked until GitLab Windows ARM64 validation and protected candidate/finalization environments are available."
    - exit 1
