name: Promote staged beta release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Protected beta tag to promote
        required: true
        type: string
      phase:
        description: Stage npm first; publish the GitHub release only after npm 2FA approval
        required: true
        type: choice
        options:
          - stage-npm
          - publish-github

permissions: {}
concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.18.0
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-release-tag.mjs "${{ inputs.tag }}"
      - run: npm run build
      - run: npm run check
      - run: npm run check:beta-readiness
      - run: node scripts/test.mjs
      - run: node scripts/publish.mjs --dry-run
      - name: Verify draft inventory, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-draft-release.mjs "${{ inputs.tag }}"
      - name: Submit four packages to npm staging with OIDC
        if: ${{ inputs.phase == 'stage-npm' }}
        run: node scripts/publish.mjs --stage --manifest npm-artifacts.json
      - name: Verify all four npm packages are public under beta
        if: ${{ inputs.phase == 'publish-github' }}
        run: node scripts/verify-npm-release.mjs
      - name: Publish GitHub prerelease after npm approval
        if: ${{ inputs.phase == 'publish-github' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --draft=false --prerelease
